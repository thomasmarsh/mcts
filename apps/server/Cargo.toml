[package]
name = "server"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
mcts-bench = { path = "../../crates/mcts-bench" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-host = { path = "../game-host" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.7.0", features = ["fs", "cors", "timeout"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio-stream = "0.1"
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
