[package]
name = "mcts-bench"
version = "0.1.0"
edition = "2021"
description = "Benchmark/tournament harness for MCTS games"
license = "MIT OR Apache-2.0"

[dependencies]
mcts = { path = "../mcts" }
game-host = { path = "../../apps/game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indicatif = { version = "0.17.8", features = ["rayon"] }
rayon = "1.8.1"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
