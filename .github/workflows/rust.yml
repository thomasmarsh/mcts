name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  DUCKDB_DOWNLOAD_LIB: 1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache DuckDB binary
      uses: actions/cache@v4
      with:
        path: target/duckdb-download
        key: duckdb-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  tuner:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        version: "0.12.10"
        enable-cache: true
    - name: Run tuner tests
      working-directory: tools/tuner
      run: uv run --locked pytest
