name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  DUCKDB_DOWNLOAD_LIB: 1

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache DuckDB binary
      uses: actions/cache@v4
      with:
        path: target/duckdb-download
        key: duckdb-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'Cargo.toml') }}
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
