# Default hyperparameter search configuration for MCTS.
# This file can be overridden with `tuner --config my-config.yaml`.
# All keys can also be overridden on the command line via `--override key=value`.
#
# The search space itself (`parameters:`/`conditions:`) is not configured
# here -- it's queried from `target.binary`'s own `tune describe` subcommand
# at launch time (`SearchConfig.parameters_from_binary`), which is the same
# metadata `mcts-tune::strategy_tuner_info` builds. A hand-maintained copy of
# that space in this file drifted out of sync with the binary once already
# (a family silently missing from a YAML list), so the binary is now the
# only place it's declared. `tune describe` also reports the available named
# baseline presets, but does not select one: every run must explicitly provide
# `target.baselines` through its config or a CLI override.

# ---------------------------------------------------------------------------
# Optimisation engine settings
# ---------------------------------------------------------------------------
optimizer:
  # Maximum number of trial configurations to evaluate
  n_trials: 1000

  # Whether the target function is deterministic (one seed) or noisy (multiple)
  deterministic: false

  # Number of parallel workers. Use null to default to cpu_count // 2.
  n_workers: null

  # Random seed for reproducibility
  seed: 42

# ---------------------------------------------------------------------------
# Target evaluation — the game binary's `tune eval` subcommand the tuner invokes
# ---------------------------------------------------------------------------
target:
  # Path (relative to current working directory or absolute) to the game binary
  # Typical invocation: cd /path/to/mcts && uv run --project tuner/ tuner
  binary: target/release/game-traffic-lights

  # Number of self-play rounds (each round: candidate-first + baseline-first
  # game) one `tune eval` call runs; passed as `--rounds`.
  rounds: 20

  # Per-*run* search-effort ceiling (MCTS iterations per move) forwarded as
  # `--max-iterations` to every `tune eval` call this run makes -- how much
  # compute a trial's candidate gets, not a hyperparameter the tuner searches
  # over (that would just reward the trial with the biggest budget, not the
  # best hyperparameters at a fixed one -- see `family`/`c`/etc. above for
  # what the tuner *does* search). Applies to a `baseline_config`-backed
  # opponent too (a ladder rung's self-play baseline, or `random`/`flat_mc`),
  # so both sides of that match stay on equal footing regardless of the
  # value chosen. `null` (the default) means "use the game binary's own
  # historical default" (`mcts-tune`'s `MAX_ITER` constant, currently
  # 10,000). Lower this (e.g. 1000) for a faster, noisier search; raise it
  # for a slower, more decisive one. Override per launch with `--override
  # target.max_iterations=1000`.
  max_iterations: null
