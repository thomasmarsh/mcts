[project]
name = "mcts-tuner"
version = "0.1.0"
description = "Foreground, reproducible game-binary strategy tuning for MCTS"
requires-python = ">=3.10,<3.14"
dependencies = ["ConfigSpace>=1.0.0,<2", "scikit-learn==1.6.1", "smac==2.4.0", "scipy==1.15.2"]

[project.scripts]
tuner = "tuner_cli.__main__:main"
tuner-proposer-bakeoff = "tuner_cli.proposer_bakeoff_main:main"
tuner-elimination-bakeoff = "tuner_cli.elimination_bakeoff_main:main"
tuner-mechanism = "tuner_cli.mechanism_main:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
# e2e/ tests run already-built game binaries and are excluded from the fast suite.
# Run them manually: uv run python tests/e2e/run_game_smokes.py
norecursedirs = ["tests/e2e"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
