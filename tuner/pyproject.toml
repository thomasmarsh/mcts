[project]
name = "mcts-tuner"
version = "0.1.0"
description = "Optuna + OpenSkill hyperparameter optimization for MCTS"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "optuna>=4.9.0",
    "openskill>=6.2.0",
]

[project.scripts]
tuner = "tuner_cli.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.pytest.ini_options]
# e2e/ tests run a real game-nim binary and are excluded from the fast suite.
# Run them manually: uv run python tests/e2e/run_e2e.py
norecursedirs = ["tests/e2e"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
