[project]
name = "hyper-cli"
version = "0.1.0"
description = "SMAC3 hyperparameter optimization for MCTS"
requires-python = ">=3.10,<3.14"
dependencies = [
    "smac>=2.4.0",
    "scikit-learn>=1.6.1,<1.9.0",
    "pyyaml>=6.0",
    "ConfigSpace>=1.0.0",
]

[project.scripts]
hyper-cli = "hyper_cli.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"