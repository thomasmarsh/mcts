[package]
name = "game-druid"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_druid"
path = "src/lib.rs"

[[bin]]
name = "game-druid"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../crates/mcts" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-host = { path = "../../apps/game-host" }
rustc-hash = "1.1.0"
rand = { version = "0.8.5", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
grid-cnn = { path = "../../crates/grid-cnn", optional = true }
mcts-batch = { path = "../../crates/mcts-batch", optional = true }
rayon = { version = "1.8.1", optional = true }

[dev-dependencies]
rand_xorshift = "0.3.0"
rand_core = "0.6.4"

[[example]]
name = "druid_selfplay"
required-features = ["cnn"]

[[example]]
name = "druid_check"
required-features = ["cnn"]

[[example]]
name = "druid_gate"
required-features = ["cnn"]

[[example]]
name = "druid_value_label"
required-features = ["cnn"]

[features]
# CNN value+policy evaluation on the GPU (MLX): batched oracle, self-play, shards, play-time agent.
# On by default; building without Homebrew's mlx/mlx-c needs `--no-default-features`. The encoder
# (`cnn::encode`) has no GPU dependency and is always built.
default = ["cnn"]
cnn = ["dep:grid-cnn", "dep:mcts-batch", "dep:rayon"]

[lints]
workspace = true
