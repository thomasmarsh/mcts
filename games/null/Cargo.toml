[lib]
name = "game_null"

[[bin]]
name = "game-null"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
game-host = { path = "../../game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"