[package]
name = "game-atarigo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_atarigo"

[[bin]]
name = "game-atarigo"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
mcts-tune = { path = "../../mcts-tune" }
bitboard = { path = "../../bitboard" }
game-host = { path = "../../game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8.5", features = ["small_rng"] }

[lints]
workspace = true