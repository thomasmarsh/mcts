[package]
name = "game-ttt-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Tic-Tac-Toe, generated by ludii's Core-IR-to-Rust codegen (see ludii/ROADMAP.md phase 4/5) from ludii/style-c/sexpr/tic-tac-toe.sc -- a point of comparison against the hand-written games/ttt."

[dependencies]
mcts = { path = "../../mcts" }
game-core = { path = "../game-core" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
