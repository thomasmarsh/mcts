[package]
name = "game-akron"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_akron"

[[bin]]
name = "game-akron"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
mcts-tune = { path = "../../mcts-tune" }
game-host = { path = "../../game-host" }
bitboard = { path = "../../bitboard" }
pyramid = { path = "../../pyramid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }

[lints]
workspace = true
