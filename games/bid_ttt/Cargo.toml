[package]
name = "game-bid-ttt"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_bid_ttt"

[[bin]]
name = "game-bid-ttt"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
game-host = { path = "../../game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8.5"