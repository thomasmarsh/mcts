# Configuration for `cargo run --release --example edax_match`.
#
# Everything a rerun wants to vary without recompiling: the engine binary,
# the weight file, which of our presets to place on the ladder, the Edax
# levels to test, how many games per level, and the RNG seed. Also read by
# `gumbel_gate --edax-only` (see its --gate-config), so every agent shares
# one protocol. Any key can be overridden with `--set key=value`.
#
# Protocol: each opening is played from both seats, so games_per_level / 2
# openings per level, a seeded subset of the balanced file (generated by
# `gen_xot_openings`). Edax is pinned to one thread. Remove `openings` to
# fall back to fresh random `opening_plies`-ply openings (the pre-XOT protocol).

edax_binary   = "games/othello/edax/vendor/bin/mEdax-native"
edax_data_dir = "games/othello/edax/vendor/data"
our_preset    = "strong"
levels        = [1, 2, 3, 4, 5, 6]
games_per_level = 200
seed          = 1
edax_threads  = 1
openings      = "games/othello/openings/xot8.txt"
# out         = "local/output/edax5/run.jsonl"   # JSONL appended per game and level
