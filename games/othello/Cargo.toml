[package]
name = "game-othello"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_othello"

[[bin]]
name = "game-othello"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../crates/mcts" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-core = { path = "../game-core" }
game-host = { path = "../../apps/game-host" }
bitboard = { path = "../../crates/bitboard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
toml = "0.8"
sha2 = "0.10"
mlx-sys = { path = "../../crates/mlx-sys", optional = true }

[dev-dependencies]
rand = "0.8"
mcts-bench = { path = "../../crates/mcts-bench", default-features = false }

[[example]]
name = "mlx_selfplay_bench"
required-features = ["mlx"]

[features]
# GPU-backed `CnnValueNet` forward pass via `mlx-sys` (Homebrew mlx-c/mlx,
# see `crates/mlx-sys/build.rs`). On by default: this backend is faster than
# the CPU path on every measured self-play/gate workload with no output
# difference (byte-identical on the same seed), so a plain `cargo build`
# gets GPU-backed inference for `--head cnn` without an opt-in flag.
# Building on a machine without Homebrew's `mlx`/`mlx-c` installed needs
# `--no-default-features` (CPU-only, always available).
default = ["mlx"]
mlx = ["dep:mlx-sys"]

[lints]
workspace = true
