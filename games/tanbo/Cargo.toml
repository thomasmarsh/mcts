[package]
name = "game-tanbo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_tanbo"

[[bin]]
name = "game-tanbo"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../crates/mcts" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-core = { path = "../game-core" }
game-host = { path = "../../apps/game-host" }
bitboard = { path = "../../crates/bitboard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
