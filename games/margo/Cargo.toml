[package]
name = "game-margo"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_margo"

[[bin]]
name = "game-margo"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../crates/mcts" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-host = { path = "../../apps/game-host" }
bitboard = { path = "../../crates/bitboard" }
pyramid = { path = "../../crates/pyramid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8.5", features = ["small_rng"] }

[lints]
workspace = true
