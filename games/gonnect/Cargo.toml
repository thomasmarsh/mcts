[package]
name = "game-gonnect"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_gonnect"

[[bin]]
name = "game-gonnect"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
mcts-tune = { path = "../../mcts-tune" }
game-core = { path = "../game-core" }
game-host = { path = "../../game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
rand = { version = "0.8.5", features = ["small_rng"] }

[lints]
workspace = true