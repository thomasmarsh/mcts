[package]
name = "game-gonnect"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_gonnect"

[[bin]]
name = "game-gonnect"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../crates/mcts" }
mcts-tune = { path = "../../crates/mcts-tune" }
game-core = { path = "../game-core" }
bitboard = { path = "../../crates/bitboard" }
game-host = { path = "../../apps/game-host" }
ntuple = { path = "../../crates/ntuple" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8.5", features = ["small_rng"] }
toml = "0.8"

[dev-dependencies]
mcts-bench = { path = "../../crates/mcts-bench", default-features = false }

[lints]
workspace = true
