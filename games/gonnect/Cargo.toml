[package]
name = "game-gonnect"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "game_gonnect"

[[bin]]
name = "game-gonnect"
path = "src/main.rs"

[dependencies]
mcts = { path = "../../mcts" }
game-core = { path = "../game-core" }
game-host = { path = "../../game-host" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true