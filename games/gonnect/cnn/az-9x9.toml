# Gonnect 9x9 AlphaZero-style run: a 128-channel x 6-block CNN trained by Gumbel self-play from
# scratch. Rust reads [net], [selfplay] and [play]; the coordinator and trainer
# (research/az-train/src/az_train/gonnect_cnn.py) read the rest.

[net]
size = 9
channels = 128
blocks = 6
policy_planes = 4
value_planes = 2
value_hidden = 64

# Self-play search (Gumbel root, Sequential Halving over `considered_actions`).
[selfplay]
games = 256
simulations = 32
considered_actions = 8
value_scale = 0.1
max_visit_init = 50
temp_moves = 8
max_plies = 300
chunk_size = 64

# The play-time agent used by the progress gate and the final gate.
[play]
simulations = 100
considered_actions = 16
value_scale = 0.1
max_visit_init = 50
chunk_size = 64

[train]
batch_size = 32
steps_per_generation = 1000
learning_rate = 1e-3
l2 = 1e-4
# Positions from this many most recent generations are sampled from.
replay_generations = 20
# Games of each generation held out to monitor value/policy fit; never trained on. Outcomes are
# per game, so the held-out value Pearson is noisy at this size; the policy metrics are steadier.
validation_games = 24
# Weight-init seeds tried for generation 1's fit if the first attempts are dead.
seed = 1
max_init_retries = 4
stall_check_step = 100
stall_check_min_value_std = 0.005
# Steps between validation evaluations (the step log is written every step).
validate_every = 100

[gate]
# Progress gate, net against net (no reference engine): the new net plays the net `lag`
# generations earlier (generation 0, the zero net, while generation <= lag) and the current
# champion, each opening from both seats. The champion is replaced by the new net when its score
# against the champion reaches `promote_score`; self-play always uses the latest net.
lag = 10
games = 40
opening_plies = 4
# Search budget of both gate agents (other search settings come from [play]).
simulations = 32
promote_score = 0.55
# Run the gate every this many generations.
every = 1
workers = 4
seed = 1
max_plies = 300

# End-of-run rating curve (`az-train-gonnect-cnn --round-robin`): checkpoints at generation 0, every
# `every`-th generation and the last one; every pair plays `games` paired games (`max_gap` > 0 keeps
# only pairs at most that many checkpoints apart, plus the final-vs-half pair the rules need).
[round_robin]
every = 10
games = 100
opening_plies = 4
simulations = 32
max_gap = 0
workers = 4
seed = 2
max_plies = 300

# Pre-registered pass / kill rules, applied by `az-train-gonnect-cnn --verdict` (and rule 1 by the
# coordinator itself at `early_gen`).
[rules]
# 1. Early kill: mean lag-gate score over generations lag+1..early_gen.
early_gen = 30
early_min_mean_lag_score = 0.55
# 2. Rating grows over every `rating_step`-generation step of the round robin (from generation 10).
rating_step = 20
# 3. Still improving: generation N vs N/2 (round-robin pair) and the last-quartile lag score.
final_vs_half_min_score = 0.60
last_quartile_min_lag_score = 0.55
# 4. Significant directed 3-cycles among the round-robin checkpoints.
max_significant_cycles = 0
# 5. Health: capped-game rate over the last 10 generations.
max_capped_rate = 0.05

# INFORMATIONAL ONLY (`--sanity-gate`, once, at the end): the champion against MCTS presets. It
# gates, promotes and stops nothing, and no rule reads it.
[sanity]
presets = "games/gonnect/presets.json"
openings = 50
opening_plies = 2
simulations = 100
workers = 4
seed = 3
max_plies = 300

[[sanity.opponent]]
name = "strong-100"
preset = "strong"
iterations = 100

[[sanity.opponent]]
name = "strong-1000"
preset = "strong"
iterations = 1000

[loop]
generations = 100
out_dir = "local/output/gonnect/cnn-9x9/run1"
