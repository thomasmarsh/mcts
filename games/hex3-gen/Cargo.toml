[package]
name = "game-hex3-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hex on a 3x3 board, generated by gdl's Core-IR-to-Rust codegen from gdl/style-c/sexpr/hex.gdls -- the single-word counterpart to games/hex-gen's now-11x11 output, kept small so gdl/tests/hex_gen_vs_interp.rs can still compare it against gdl::core::interp::State (itself capped at 64 cells)."

[dependencies]
mcts = { path = "../../mcts" }
game-core = { path = "../game-core" }
bitboard = { path = "../../bitboard" }
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
