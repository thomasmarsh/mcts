[package]
name = "game-hex-gen"
version = "0.1.0"
edition = "2021"
publish = false
description = "Hex, generated by gdl's Core-IR-to-Rust codegen from gdl/style-c/sexpr/hex.gdls -- the second game routed through codegen, after games/ttt-gen."

[dependencies]
mcts = { path = "../../mcts" }
mcts-tune = { path = "../../mcts-tune" }
game-core = { path = "../game-core" }
game-host = { path = "../../game-host" }
bitboard = { path = "../../bitboard" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
