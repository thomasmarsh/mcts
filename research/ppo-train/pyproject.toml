[project]
name = "ppo-train"
version = "0.1.0"
description = "Search-free OmniReset-style self-play PPO trainer for Othello"
requires-python = ">=3.11,<3.14"
dependencies = [
    "az-train",
    "numpy>=2,<3",
    "othello-eval",
    "torch>=2.14.0",
]

[project.scripts]
ppo-train-othello = "ppo_train.train:main"

[tool.uv.sources]
az-train = { path = "../az-train", editable = true }
othello-eval = { path = "../othello-eval", editable = true }

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
