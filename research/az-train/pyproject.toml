[project]
name = "az-train"
version = "0.1.0"
description = "Gumbel AlphaZero self-play trainer for the mcts workspace"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2,<3",
]

[project.scripts]
az-train = "az_train.train:train_cli"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=8.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
