[project]
name = "mcts-smac3"
version = "0.1.0"
description = "SMAC3 hyperparameter optimization for MCTS"
requires-python = ">=3.10,<3.14"
dependencies = [
    "pyyaml>=6.0",
    "optuna>=4.9.0",
    "trueskill>=0.4.5",
]

[project.scripts]
smac3 = "smac3_cli.__main__:main"

[dependency-groups]
dev = ["pytest>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
