# Default hyperparameter search configuration for MCTS.
# This file can be overridden with `smac3 --config my-config.yaml`.
# All keys can also be overridden on the command line via `--override key=value`.

# ---------------------------------------------------------------------------
# SMAC3 optimisation engine settings
# ---------------------------------------------------------------------------
optimizer:
  # Maximum number of trial configurations to evaluate
  n_trials: 1000

  # Whether the target function is deterministic (one seed) or noisy (multiple)
  deterministic: false

  # Number of parallel workers. Use null to default to cpu_count // 2.
  n_workers: null

  # Random seed for reproducibility
  seed: 42

# ---------------------------------------------------------------------------
# Target evaluation — the game binary's `tune eval` subcommand SMAC invokes
# ---------------------------------------------------------------------------
target:
  # Path (relative to current working directory or absolute) to the game binary
  # Typical invocation: cd /path/to/mcts && uv run --project smac3/ smac3
  binary: target/release/game-traffic-lights

  # Number of self-play rounds (each round: candidate-first + baseline-first
  # game) one `tune eval` call runs; passed as `--rounds`.
  rounds: 20

# ---------------------------------------------------------------------------
# Search space — each entry becomes a key in the JSON object passed to the
# binary's `tune eval --config` flag.
#
# Types:
#   float       -> UniformFloat hyperparameter (continuous)
#   int         -> UniformInteger
#   categorical -> Categorical
#   constant    -> Constant (fixed, excluded from search)
# ---------------------------------------------------------------------------
parameters:
  bias:
    type: float
    bounds: [0, 10]
    default: 0.00001

  c:
    type: float
    bounds: [0, 3]
    default: 1.4142135623730951

  epsilon:
    type: float
    bounds: [0, 1]
    default: 0.1

  final_action:
    type: constant
    value: robust_child

  k:
    type: int
    bounds: [0, 2000]
    default: 1000

  q_init:
    type: categorical
    choices: [Draw, Infinity, Loss, Parent, Win]
    default: Infinity

  rave:
    type: int
    bounds: [0, 2000]
    default: 700

  schedule:
    type: categorical
    choices: [hand_selected, min_mse, threshold]
    default: threshold

  threshold:
    type: int
    bounds: [0, 2000]
    default: 700

  rave_ucb:
    type: categorical
    choices: [none, ucb1, tuned]
    default: tuned

# ---------------------------------------------------------------------------
# Conditional parameter activation — an active parameter is always included
# in the `--config` JSON object; inactive parameters are omitted (they are
# imputed with their default when training the surrogate model).
#
# Each entry: if <parent> == <value(s)>, then <children> become active.
# ---------------------------------------------------------------------------
conditions:
  - if: { schedule: hand_selected }
    then: [k]
  - if: { schedule: min_mse }
    then: [bias]
  - if: { schedule: threshold }
    then: [rave]
  - if: { rave_ucb: [ucb1, tuned] }
    then: [c]
