[workspace]
resolver = "2"
members = [
    "mcts",
    "mcts-bench",
    "game-host",
    "games/breakthrough",
    "games/knightthrough",
    "games/othello",
    "games/tanbo",
    "games/traffic-lights",
    "games/ttt",
    "mcts-tests",
    "games/atarigo",
    "games/bid_ttt",
    "games/count",
    "games/gonnect",
    "games/nim",
    "games/null",
    "games/shibumi",
    "games/tak",
    "games/unit",
    "games/druid",
    "server",
    "bench",
]

[profile.dev]
debug = 1

[profile.profiling]
inherits = "release"
debug = true
lto = true

[profile.release]
# Line tables only — full debug info (debug=true) made release 7+ GB.
# profiling/samply profiles below override with debug=true when needed.
debug = 1
lto = true

[profile.samply]
inherits = "release"
debug = true
